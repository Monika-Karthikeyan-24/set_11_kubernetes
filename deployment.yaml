
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-auto-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: github-auto-app
  template:
    metadata:
      labels:
        app: github-auto-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
